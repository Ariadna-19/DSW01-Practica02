name: 02 Sonar Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sonar:
    name: SonarCloud Frontend and Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dsw01_practica02
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dsw01_practica02"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests with coverage
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage
        working-directory: frontend

      - name: Run backend tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dsw01_practica02
          DB_USER: postgres
          DB_PASSWORD: postgres
          SPRING_SECURITY_USER_NAME: admin
          SPRING_SECURITY_USER_PASSWORD: admin123
          SPRING_SECURITY_USER_ROLES: USER
        run: mvn -B test
        working-directory: backend

      - name: SonarCloud scan
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login="${SONAR_TOKEN}" \
            -Dsonar.sources=backend/src/main/java,frontend/src \
            -Dsonar.tests=backend/src/test/java,frontend/src \
            -Dsonar.test.inclusions=backend/src/test/java/**/*Test.java,frontend/src/**/*.spec.ts \
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info \
            -Dsonar.java.binaries=backend/target/classes \
            -Dsonar.exclusions=frontend/node_modules/**,frontend/dist/**,frontend/.angular/**,backend/target/**,specs/**,docs/**
        working-directory: backend
