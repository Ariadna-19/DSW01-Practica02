name: 03 Cypress E2E

on:
  workflow_run:
    workflows: 
      -02_sonar
    types:
      - completed
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  detect-cypress:
    name: Detect Cypress Setup
    runs-on: ubuntu-latest
    outputs:
      has_cypress: ${{ steps.detect.outputs.has_cypress }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect config and specs
        id: detect
        run: |
          HAS_CONFIG="false"
          HAS_SPECS="false"

          if compgen -G "frontend/cypress.config.*" > /dev/null; then
            HAS_CONFIG="true"
          fi

          if compgen -G "frontend/cypress/e2e/**/*.cy.*" > /dev/null; then
            HAS_SPECS="true"
          fi

          if [[ "$HAS_CONFIG" == "true" && "$HAS_SPECS" == "true" ]]; then
            echo "has_cypress=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cypress=false" >> "$GITHUB_OUTPUT"
            echo "Cypress config/specs not found in frontend. Skipping E2E run."
          fi

  cypress:
    name: Run Cypress E2E
    needs: detect-cypress
    if: needs.detect-cypress.outputs.has_cypress == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dsw01_practica02
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dsw01_practica02"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Start backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dsw01_practica02
          DB_USER: postgres
          DB_PASSWORD: postgres
          SPRING_SECURITY_USER_NAME: admin
          SPRING_SECURITY_USER_PASSWORD: admin123
          SPRING_SECURITY_USER_ROLES: USER
        run: mvn -B spring-boot:run > backend.log 2>&1 &
        working-directory: backend

      - name: Start frontend
        run: npm run start -- --host 0.0.0.0 --port 4200 > frontend.log 2>&1 &
        working-directory: frontend

      - name: Wait for services
        run: npx --yes wait-on http://localhost:4200 http://localhost:8080/v3/api-docs

      - name: Run Cypress
        run: npx --yes cypress@13 run
        working-directory: frontend

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log

      - name: Upload frontend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-log
          path: frontend/frontend.log
