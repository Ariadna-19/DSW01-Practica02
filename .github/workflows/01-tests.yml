name: 01-tests

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Unit and Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dsw01_practica02
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dsw01_practica02"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dsw01_practica02
          DB_USER: postgres
          DB_PASSWORD: postgres
          SPRING_SECURITY_USER_NAME: admin
          SPRING_SECURITY_USER_PASSWORD: admin123
          SPRING_SECURITY_USER_ROLES: USER
        run: mvn -B test
        working-directory: backend

      - name: Validate backend build
        run: mvn -B -DskipTests package
        working-directory: backend

  frontend-tests:
    name: Frontend Unit and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend unit tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend

      - name: Validate frontend build
        run: npm run build
        working-directory: frontend